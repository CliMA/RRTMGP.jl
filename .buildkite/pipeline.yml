agents:
  queue: central
  modules: climacommon/2025_03_18

env:
  JULIA_LOAD_PATH: "${JULIA_LOAD_PATH}:${BUILDKITE_BUILD_CHECKOUT_PATH}/.buildkite"
  OPENBLAS_NUM_THREADS: 1
  JULIA_NVTX_CALLBACKS: gc
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  SLURM_KILL_BAD_EXIT: 1

steps:
  - label: "init test environments :computer:"
    key: "init_env"
    command:

      - echo "--- Instantiate test environment"
      - "julia --project=test -e 'using Pkg; Pkg.develop(path=\".\")'"
      - "julia --project=test -e 'using Pkg; Pkg.instantiate(;verbose=true)'"
      - "julia --project=test -e 'using Pkg; Pkg.precompile()'"
      - "julia --project=test -e 'using Pkg; Pkg.status()'"

    agents:
      slurm_mem: 16G 
      slurm_gpus: 1
      slurm_cpus_per_task: 4

  - wait

  - group: "Unit tests"
    steps:

      - label: "CPU unit tests"
        command: "julia --color=yes --project=test test/runtests.jl"
        agents:
          slurm_ntasks: 1
          slurm_mem_per_cpu: 6G

      - label: "Threaded CPU unit tests"
        command: "julia --threads 8 --color=yes --project=test test/runtests.jl"
        agents:
          slurm_cpus_per_task: 8
          slurm_mem_per_cpu: 6G

      - label: "GPU unit tests"
        command: "julia --color=yes --project=test test/runtests.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_ntasks: 1
          slurm_gpus: 1

  - group: "Flame graphs"
    steps:

      - label: "Flame Graph: Gray Atm"
        command: "julia --color=yes --project=test perf/flame.jl gray_atm.jl"
        artifact_paths: "flame_graphs/gray_atm/*"
        agents:
          slurm_ntasks: 1
          slurm_mem_per_cpu: 6G

      - label: "Flame Graph: Clear Sky"
        command: "julia --color=yes --project=test perf/flame.jl clear_sky.jl"
        artifact_paths: "flame_graphs/clear_sky/*"
        agents:
          slurm_ntasks: 1
          slurm_mem_per_cpu: 6G

      - label: "Flame Graph: All Sky"
        command: "julia --color=yes --project=test perf/flame.jl cloudy_sky.jl"
        artifact_paths: "flame_graphs/cloudy_sky/*"
        agents:
          slurm_ntasks: 1
          slurm_mem_per_cpu: 6G

  - group: "Benchmarks"
    steps:
  
      - label: "Benchmarks"
        command: "julia --color=yes --project=test perf/benchmark.jl"
        agents:
          slurm_ntasks: 1
          slurm_mem_per_cpu: 6G
  
      - label: "Benchmarks (Float32)"
        command: "julia --color=yes --project=test perf/benchmark.jl Float32"
        agents:
          slurm_ntasks: 1
          slurm_mem_per_cpu: 6G

      - label: "Threaded benchmarks"
        command: "julia --threads=8 --color=yes --project=test perf/benchmark.jl"
        agents:
          slurm_cpus_per_task: 8
          slurm_mem_per_cpu: 6G

      - label: "GPU benchmarks"
        command: "julia --color=yes --project=test perf/benchmark.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_ntasks: 1
          slurm_gpus: 1

      - label: "GPU clear-sky DYAMOND benchmark"
        command: "julia --color=yes --project=test test/clear_sky_dyamond_gpu_benchmark.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_ntasks: 1
          slurm_gpus: 1

      - label: "GPU all-sky DYAMOND benchmark"
        command: "julia --color=yes --project=test test/cloudy_sky_dyamond_gpu_benchmark.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_ntasks: 1
          slurm_gpus: 1

      - label: "GPU all-sky with aerosols DYAMOND benchmark"
        command: "julia --color=yes --project=test test/all_sky_with_aerosols_dyamond_gpu_benchmark.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_ntasks: 1
          slurm_gpus: 1

      # Advisory wall-time ratchet against committed per-GPU baselines
      # (perf/benchmark_baselines/). Soft-fail: flags regressions without
      # blocking merges; see the header of perf/benchmark_ratchet.jl.
      - label: "GPU DYAMOND benchmark ratchet"
        command: "julia --color=yes --project=test perf/benchmark_ratchet.jl"
        soft_fail: true
        artifact_paths: "perf/benchmark_baselines/*"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_ntasks: 1
          slurm_gpus: 1

  - group: "Downstream tests"
    steps:
      # Run ClimaAtmos CI against this RRTMGP commit. ClimaAtmos's pipeline reads
      # UPSTREAM_PACKAGES and `Pkg.add`s each `Package#rev` entry at that rev,
      # dropping the package's [compat] bound so an unreleased RRTMGP resolves
      # (see ClimaAtmos.jl's .buildkite/full_pipeline.yml "Downstream test hook").
      - label: ":rocket: Downstream: trigger ClimaAtmos CI"
        # Deliberately NOT climaatmos-ci: downstream builds run on atmos `main`,
        # and building them in that pipeline would pollute its main-branch status
        # badge and build history. climaatmos-downstream uses the same config but
        # is a separate pipeline.
        trigger: "climaatmos-downstream"
        build:
          branch: "main"
          message: "Downstream test: RRTMGP ${BUILDKITE_BRANCH} @ ${BUILDKITE_COMMIT:0:8}"
          env:
            UPSTREAM_PACKAGES: "RRTMGP#${BUILDKITE_COMMIT}"
        soft_fail: true # downstream test failures don't block a merge
